name: Build and deploy test app

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
    paths:
      - "app/**"
      - ".github/workflows/app-docker-build.yml"

env:
  REGISTRY: cr.yandex
  REGISTRY_ID: ${{ secrets.YC_REGISTRY_ID }}
  IMAGE_NAME: test-app

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image tag
        id: meta
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"
          fi

      - name: Login to Yandex Container Registry
        run: |
          echo '${{ secrets.YC_SA_KEY_JSON }}' | docker login \
            --username json_key --password-stdin ${{ env.REGISTRY }}

      - name: Build image
        run: |
          docker build -t ${{ env.REGISTRY }}/${{ env.REGISTRY_ID }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }} ./app

      - name: Push image (commit/tag)
        run: |
          docker push ${{ env.REGISTRY }}/${{ env.REGISTRY_ID }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}

      - name: Also push :latest on main
        if: github.ref == 'refs/heads/main'
        run: |
          docker tag ${{ env.REGISTRY }}/${{ env.REGISTRY_ID }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }} \
            ${{ env.REGISTRY }}/${{ env.REGISTRY_ID }}/${{ env.IMAGE_NAME }}:latest
          docker push ${{ env.REGISTRY }}/${{ env.REGISTRY_ID }}/${{ env.IMAGE_NAME }}:latest

  deploy:
    needs: build-and-push
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install yc CLI and get kubeconfig
        run: |
          curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash -s -- -i /home/runner/yc -n
          echo '${{ secrets.YC_SA_KEY_JSON }}' > sa-key.json
          /home/runner/yc/bin/yc config set service-account-key sa-key.json
          /home/runner/yc/bin/yc managed-kubernetes cluster get-credentials ${{ secrets.YC_K8S_CLUSTER_ID }} --external --force
          rm sa-key.json
          echo "/home/runner/yc/bin" >> "$GITHUB_PATH"

      - name: Deploy new image
        run: |
          kubectl -n app set image deployment/test-app \
            test-app=${{ env.REGISTRY }}/${{ env.REGISTRY_ID }}/${{ env.IMAGE_NAME }}:${{ needs.build-and-push.outputs.image_tag }}
          kubectl -n app rollout status deployment/test-app --timeout=120s
