# Values для чарта bitnami/grafana.
#
# helm upgrade --install grafana bitnami/grafana -n monitoring -f k8s/monitoring/grafana-values.yaml

# Docker Hub недоступен напрямую из сети Yandex Cloud, тянем через
# официальное зеркало (cr.yandex/mirror вместо docker.io).
global:
  imageRegistry: cr.yandex/mirror
  security:
    allowInsecureImages: true

service:
  type: LoadBalancer
  ports:
    grafana: 80

admin:
  user: admin
  password: "changeme-please"

datasources:
  secretDefinition:
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        url: http://kube-prometheus-prometheus.monitoring.svc.cluster.local:9090
        access: proxy
        isDefault: true
