# Values для чарта prometheus-community/kube-prometheus-stack.
# Устанавливает Prometheus Operator, Prometheus, Alertmanager, Grafana,
# node-exporter и kube-state-metrics одним релизом.
#
# helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
# helm repo update
# helm upgrade --install kube-prometheus prometheus-community/kube-prometheus-stack \
#   -n monitoring -f k8s/monitoring/values.yaml
#
# Часть образов чарта лежит на quay.io, который недоступен из сети
# Yandex Cloud. Такие образы перезалиты в свой Container Registry
# (cr.yandex/crpot29o0cam408r5p0d/mirror/*) и переопределены на него.
# docker.io и registry.k8s.io образы (grafana, kube-state-metrics) тянутся
# напрямую, они доступны стабильно.

grafana:
  service:
    type: LoadBalancer
    port: 80
  adminPassword: "changeme-please"
  defaultDashboardsEnabled: true

prometheus:
  prometheusSpec:
    retention: 5d
    image:
      registry: cr.yandex
      repository: crpot29o0cam408r5p0d/mirror/prometheus
      tag: v3.14.0-distroless
    resources:
      requests:
        cpu: 100m
        memory: 400Mi
      limits:
        memory: 800Mi

alertmanager:
  alertmanagerSpec:
    image:
      registry: cr.yandex
      repository: crpot29o0cam408r5p0d/mirror/alertmanager
      tag: v0.34.0
    resources:
      requests:
        cpu: 25m
        memory: 64Mi

nodeExporter:
  enabled: true

prometheus-node-exporter:
  image:
    registry: cr.yandex
    repository: crpot29o0cam408r5p0d/mirror/node-exporter
    tag: v1.12.1-distroless
    distroless: false # чарт иначе сам добавит суффикс -distroless повторно

kubeStateMetrics:
  enabled: true

kube-state-metrics:
  image:
    registry: cr.yandex
    repository: crpot29o0cam408r5p0d/mirror/kube-state-metrics
    tag: v2.20.0

prometheusOperator:
  image:
    registry: cr.yandex
    repository: crpot29o0cam408r5p0d/mirror/prometheus-operator
    tag: v0.93.1
  prometheusConfigReloader:
    image:
      registry: cr.yandex
      repository: crpot29o0cam408r5p0d/mirror/prometheus-config-reloader
      tag: v0.93.1
  # Отключаем admission-webhook: избавляет от зависимости на ghcr.io
  # (образ certgen), не нужен для базовой работы стека.
  admissionWebhooks:
    enabled: false

# В managed k8s нет доступа к control-plane компонентам напрямую,
# отключаем сборщики метрик, которые все равно не найдут таргеты.
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeEtcd:
  enabled: false
