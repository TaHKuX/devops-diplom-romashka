# Values для чарта bitnami/kube-prometheus (Prometheus Operator, Prometheus,
# Alertmanager, kube-state-metrics, node-exporter). Используется вместо
# prometheus-community/kube-prometheus-stack, потому что образы этого чарта
# лежат на docker.io, а не на quay.io/ghcr.io.
#
# helm repo add bitnami https://charts.bitnami.com/bitnami
# helm repo update
# helm upgrade --install kube-prometheus bitnami/kube-prometheus -n monitoring -f k8s/monitoring/values.yaml
#
# Grafana ставится отдельным чартом (bitnami/kube-prometheus её не включает),
# см. k8s/monitoring/grafana-values.yaml.

# Docker Hub недоступен напрямую из сети Yandex Cloud, поэтому все образы
# тянем через официальное зеркало Yandex Cloud (cr.yandex/mirror вместо
# docker.io), сохраняя тот же путь до образа.
global:
  imageRegistry: cr.yandex/mirror
  security:
    allowInsecureImages: true

prometheus:
  retention: "5d"
  resources:
    requests:
      cpu: 100m
      memory: 400Mi
    limits:
      memory: 800Mi

alertmanager:
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
