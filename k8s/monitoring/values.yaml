# Values для чарта prometheus-community/kube-prometheus-stack.
# Устанавливает Prometheus Operator, Prometheus, Alertmanager,
# Grafana, node-exporter и kube-state-metrics одним релизом.
#
# helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
# helm upgrade --install kube-prometheus prometheus-community/kube-prometheus-stack \
#   -n monitoring -f k8s/monitoring/values.yaml

grafana:
  service:
    type: LoadBalancer
    port: 80
  adminPassword: "changeme-please"
  defaultDashboardsEnabled: true

prometheus:
  prometheusSpec:
    retention: 5d
    resources:
      requests:
        cpu: 100m
        memory: 400Mi
      limits:
        memory: 800Mi

alertmanager:
  alertmanagerSpec:
    resources:
      requests:
        cpu: 25m
        memory: 64Mi

nodeExporter:
  enabled: true

kubeStateMetrics:
  enabled: true

# В managed k8s нет доступа к control-plane компонентам напрямую —
# отключаем сборщики метрик, которые всё равно не найдут таргеты.
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeEtcd:
  enabled: false
